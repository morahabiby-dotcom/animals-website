.ar{font-size:1.8rem}

<script>
const $=id=>document.getElementById(id);
const TP={s:["Sorting animals","🌍"],v:["Vertebrates","🦴"],k:["Identification keys","🔑"],f:["Food chains","🔗"],p:["Producers and consumers","🌱"],h:["Humans and food chains","🦧"]};
const MIS={s:"The words vertebrate and invertebrate sound alike, so they are easy to swap.",v:"The five groups can get mixed up. Features like lungs, gills, fur and feathers are a lot to remember.",k:"A key needs one yes/no question at a time. It is easy to skip a step.",f:"The arrow is easy to read the wrong way round. It means ‘is eaten by’.",p:"Producer and consumer are new words, so they can get swapped.",h:"The orangutan story has many facts. The cause (rainforests cut down for palm oil plants) can be missed."};
const HELP={s:"Draw two boxes: ‘backbone’ and ‘no backbone’. Sort pictures of animals together.",v:"Make five cards (mammal, bird, fish, reptile, amphibian). Talk about one feature on each card.",k:"Play ‘guess the animal’ using only yes/no questions, like ‘Does it have legs?’",f:"Draw grass → rabbit → fox. Point to each arrow and say ‘is eaten by’.",p:"Look at a garden or a pet. Ask: ‘Who makes food? Who eats it?’",h:"Read the orangutan story together. Ask: ‘What happens when forests are cut down?’"};
function row(a,ar){return '<div class="row">'+a.map((x,i)=>(i&&ar?'<b class="ar">➜</b>':'')+'<div class="it"><span class="em">'+x[0]+'</span><span class="lb">'+x[1]+'</span></div>').join('')+'</div>'}
const kb=t=>'<div class="kb">'+t+'</div>';
const LS=[
{t:"Sort living things",e:"🌍",l:["Living things grow and move.","Scientists sort living things into groups.","First, they sort them into animals and plants.","Plants have roots and leaves.","Birds are animals."],p:'<div class="cap">Living things</div>'+row([["🦗","animals"],["🌳","plants"]])},
{t:"Backbone or no backbone?",e:"🦴",l:["A backbone is also called a spine.","Animals with a backbone are vertebrates.","Animals without a backbone are invertebrates.","Fish, birds, crocodiles and humans are vertebrates.","Crabs, spiders, beetles and jellyfish are invertebrates."],p:'<div class="cap">Vertebrates (have a spine)</div>'+row([["🐟","fish"],["🐦","bird"],["🐊","crocodile"],["🧒","human"]])+'<div class="cap">Invertebrates (no backbone)</div>'+row([["🦀","crab"],["🕷️","spider"],["🐞","beetle"],["🪼","jellyfish"]])},
{t:"Five groups of vertebrates",e:"🐯",l:["Vertebrates have five groups.","The groups are mammals, birds, fish, reptiles and amphibians.","Each group shares special features.","Baby mammals grow in their mother’s body and are born.","Mammals have fur or skin.","Mammals move on four or two legs.","Mammals eat plants and other animals.","Mammals breathe with lungs.","Some animals breathe with gills."],p:row([["🐯","mammals"],["🦚","birds"],["🐠","fish"],["🐢","reptiles"],["🐸","amphibians"]])},
{t:"Identification keys",e:"🔑",l:["To classify means to sort.","Scientists use Identification keys to classify living things.","A key asks questions.","Follow the YES and NO answers to find the animal.","Tip: wooden lolly sticks are easy to use for a key."],p:kb("1️⃣ Does it have legs? <b>NO</b> ➜ 🦈 shark (fish)")+kb("<b>YES</b> ➜ 2️⃣ Does it have feathers? <b>YES</b> ➜ 🦜 parrot (bird)")+kb("<b>NO</b> ➜ 3️⃣ Does it lay eggs? <b>NO</b> ➜ 🦁 lion (mammal)")+kb("<b>YES</b> ➜ 4️⃣ Question 4 splits 🦎 chameleon (reptile) and 🐸 frog (amphibian)")},
{t:"What is a food chain?",e:"🔗",l:["A food chain is a diagram.","It shows how animals are linked by what they eat.","Grass is eaten by an impala.","The impala is eaten by a lion.","The arrow means ‘is eaten by’.","All food chains start with the Sun.","Plants use the Sun’s energy to make food.","The living part of a food chain starts with plants and ends with animals."],p:row([["🌿","grass"],["🦌","impala"],["🦁","lion"]],1)},
{t:"Producers and consumers",e:"🌱",l:["In a food chain, plants are called producers.","They produce food that animals eat.","Animals are called consumers.","Consumers eat plants and other animals."],p:row([["🌱","plant: producer"],["🐌","slug: consumer"],["🐸","frog: consumer"],["🐦","heron: consumer"]],1)},
{t:"Food chains in habitats",e:"🏜️",l:["You can find food chains in every habitat.","Desert: desert grasses, kangaroo rat, desert fox.","Ocean: phytoplankton, krill, squid, penguin, leopard seal.","Arctic: lichen, Arctic hare, Arctic fox, polar bear.","Look outside! You can make a food chain from plants and animals near you."],p:'<div class="cap">A food chain from the book’s picture</div>'+row([["🌿","plant"],["🐀","rat"],["🐍","snake"],["🐦","bird"]],1)},
{t:"Food chains can change",e:"🌧️",l:["Food chains can change.","Sometimes a part of the chain changes.","Think: grass, rabbit, fox.","If there is no rain, the grass dries up and dies.","Then the rabbits have no food.","The foxes may have nothing to eat too."],p:row([["🌿","grass"],["🐰","rabbit"],["🦊","fox"]],1)+'<div class="cap">☀️ No rain = no grass!</div>'},
{t:"Humans and orangutans",e:"🦧",l:["Humans can change food chains.","Orangutans live in rainforests on the island of Borneo.","‘Orangutan’ means ‘person of the forest’.","They live up in the trees.","They eat fruits, leaves, shoots, bark, insects and eggs.","Leopards are predators. They eat orangutans.","People cut down rainforests to grow palm oil plants.","Palm oil is used to make foods like biscuits. It is also used as fuel instead of petrol."],p:row([["🌴","rainforest plants"],["🦧","orangutan"],["🐆","leopard"]],1)},
{t:"What can you do?",e:"✅",l:["You can describe fish, reptiles, amphibians, mammals, birds and insects.","You can describe a food chain.","You can say which parts are producers and consumers.","You can make a food chain.","You can say how humans can change a food chain."],p:'<p class="big">🎉🏅🎉</p>'}];
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function show(n){["study","review","quiz","parents"].forEach(s=>{$(s).hidden=s!=n;$("n_"+s).classList.toggle("on",s==n)});try{speechSynthesis.cancel()}catch(e){}scrollTo(0,0)}
let li=0;
function study(){const L=LS[li],last=li==LS.length-1;
$("study").innerHTML='<div class="bar"><i style="width:'+(li+1)/LS.length*100+'%"></i></div><p class="mu">Lesson '+(li+1)+' of '+LS.length+'</p><div class="card"><h2>'+L.e+' '+L.t+'</h2><button class="b3" onclick="say(LS[li].t+\'. \'+LS[li].l.join(\' \'))">🔊 Read Aloud</button><p class="mu">Tap any line to hear it.</p>'+L.l.map(x=>'<p class="ln" onclick="say(this.lastChild.textContent)"><span>👉</span><span>'+x+'</span></p>').join("")+'<div class="pic">'+L.p+'</div></div><div class="nav2"><button class="b4" '+(li?"":"disabled")+' onclick="li--;study()">⬅️ Back</button><button class="b1" onclick="'+(last?"show(\'review\')":"li++;study()")+'">'+(last?"Go to Review ➡️":"Next ➡️")+'</button></div>';scrollTo(0,0)}
const RV=[["s","What are vertebrates?","Animals with a backbone (spine). Fish, birds, crocodiles and humans are vertebrates."],["s","Name two invertebrates.","Crab, spider, beetle or jellyfish. They have no backbone."],["v","Name the five groups of vertebrates.","Mammals, birds, fish, reptiles and amphibians."],["v","How do mammals breathe?","With lungs. Baby mammals grow in their mother’s body and are born."],["k","What does classify mean?","To sort. Scientists use Identification keys to classify living things."],["k","In the key, which animal has no legs?","The shark. It is a fish."],["f","What does the arrow in a food chain mean?","‘Is eaten by’. Grass ➜ impala means the grass is eaten by the impala."],["f","Where does every food chain start?","With the Sun. Plants use its energy to make food, so the living part starts with plants."],["p","What is a producer? What is a consumer?","A producer is a plant. It produces food. A consumer is an animal. It eats plants and other animals."],["f","If the grass dies, what may happen to rabbits and foxes?","The rabbits have no food, so they may die or move away. Then the foxes may have nothing to eat too."],["h","Why are rainforests cut down in Borneo?","To grow palm oil plants. Palm oil is used in foods like biscuits and as fuel."],["h","What does ‘orangutan’ mean?","‘Person of the forest’."]];
let rf="all";
function review(){$("review").innerHTML='<h2>🧠 Think first, then tap!</h2><div class="chips"><button class="chip '+(rf=="all"?"on":"")+'" onclick="rf=\'all\';review()">⭐ All</button>'+Object.keys(TP).map(k=>'<button class="chip '+(rf==k?"on":"")+'" onclick="rf=\''+k+'\';review()">'+TP[k][1]+' '+TP[k][0]+'</button>').join("")+'</div>'+RV.map((r,i)=>rf=="all"||rf==r[0]?'<div class="card"><span class="tag">'+TP[r[0]][1]+' '+TP[r[0]][0]+'</span><h2 style="margin-top:8px">'+r[1]+'</h2><button class="b3" onclick="say(RV['+i+'][1])">🔊 Read Aloud</button> <button class="b2" onclick="ra('+i+')">👀 Show the answer</button><div class="ans" id="a'+i+'" hidden><p style="margin:0">'+r[2]+'</p><button class="b3" style="margin-top:8px" onclick="say(RV['+i+'][2])">🔊 Read answer</button></div></div>':"").join("")}
function ra(i){$("a"+i).hidden=!$("a"+i).hidden}
const Q=[
{k:"s",t:"mc",q:"Scientists first sort living things into…",o:["Animals and plants","Big and small","Hot and cold","Day and night"],a:0,x:"First, scientists sort living things into animals and plants."},
{k:"s",t:"tf",q:"Vertebrates are animals with a backbone.",o:["True","False"],a:0,x:"Yes! A backbone is also called a spine."},
{k:"s",t:"mc",q:"Which animal is an invertebrate?",o:["Fish","Crab","Bird","Human"],a:1,x:"A crab has no backbone. Fish, birds and humans are vertebrates."},
{k:"s",t:"fb",q:"Animals without a backbone are called ______.",a:["invertebrates","invertebrate"],x:"No backbone means invertebrate."},
{k:"v",t:"mc",q:"Which one is NOT a group of vertebrates?",o:["Mammals","Birds","Insects","Fish"],a:2,x:"The five groups are mammals, birds, fish, reptiles and amphibians."},
{k:"v",t:"tf",q:"Mammals breathe with gills.",o:["True","False"],a:1,x:"Mammals breathe with lungs."},
{k:"k",t:"mc",q:"In the Identification key, which animal has no legs?",o:["Lion","Parrot","Shark","Frog"],a:2,x:"The shark has no legs. It is a fish."},
{k:"k",t:"fb",q:"Scientists use Identification ______ to sort living things.",a:["keys","key"],x:"An Identification key asks questions to classify (sort) living things."},
{k:"f",t:"tf",q:"The arrow in a food chain means ‘is eaten by’.",o:["True","False"],a:0,x:"Yes! Grass ➜ impala means the grass is eaten by the impala."},
{k:"f",t:"mc",q:"The living part of a food chain always starts with…",o:["Plants","Lions","Rabbits","Owls"],a:0,x:"Plants use the Sun’s energy to make food, so food chains start with plants."},
{k:"p",t:"fb",q:"In a food chain, plants are called ______.",a:["producers","producer"],x:"Plants produce food. Animals are consumers."},
{k:"h",t:"mc",q:"Why are some rainforests in Borneo cut down?",o:["To grow palm oil plants","To build a swimming pool","To make snow","To plant a zoo"],a:0,x:"People cut them down to grow palm oil plants. This changes the orangutans’ food chain."}];
const SQ="Bonus: What would happen to a food chain if the grass dried up and died?";
const ok=(q,a)=>q.t=="fb"?q.a.includes(String(a==null?"":a).trim().toLowerCase()):a===q.a;
let qi=0,ans=[],name="",email="",sent="",done=false;
function qform(msg){$("quiz").innerHTML='<div class="card"><p class="big">⭐🦁⭐</p><h2>Ready for the quiz?</h2><p>Tell us about you first.</p><label>Your name<input id="qn" autocomplete="name" value="'+(name||"")+'"></label><label>Your email (or a parent’s email)<input id="qe" type="email" autocomplete="email" value="'+(email||"")+'"></label><p class="err" id="qm">'+(msg||"")+'</p><button class="b1" onclick="qstart()">🚀 Start the quiz</button></div>'}
function qstart(){const n=$("qn").value.trim(),e=$("qe").value.trim();
if(n.length<2||!/[A-Za-z\u00C0-\u024F\u0600-\u06FF]/.test(n))return qform("Please type your name (at least 2 letters). 😊");
if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e))return qform("Please type a correct email, like name@mail.com 📧");
name=n;email=e;qi=0;ans=[];sent="";done=false;qshow()}
function qshow(chk){const q=Q[qi];
let h='<div class="bar"><i style="width:'+qi/Q.length*100+'%"></i></div><p class="mu">Question '+(qi+1)+' of '+Q.length+'</p><div class="card"><span class="tag">'+TP[q.k][1]+' '+TP[q.k][0]+'</span><h2 style="margin-top:8px">'+q.q+'</h2>';

else h+=q.o.map((o,i)=>'<button class="opt '+(chk?(i==q.a?"g":i==ans[qi]?"r":""):"")+'" '+(chk?"disabled":"")+' onclick="qpick('+i+')">'+"ABCD"[i]+'. '+o+'</button>').join("");
if(chk){const g=ok(q,ans[qi]);h+='<div class="fbk '+(g?"ok":"no")+'">'+(g?"🌟 Great job! ⭐⭐⭐":"💪 Nice try! The answer is: "+(q.t=="fb"?q.a[0]:q.o[q.a]))+'<br>'+q.x+'</div><button class="b1" style="margin-top:10px" onclick="qnext()">'+(qi==Q.length-1?"Next ➡️":"Next ➡️")+'</button>'}

function conf(){const e=["🎉","⭐","🌟","✨","🎊"];for(let i=0;i<22;i++){const s=document.createElement("span");s.className="cf";s.textContent=e[i%5];s.style.left=Math.random()*95+"%";s.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2200)}}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function dec(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return JSON.parse(decodeURIComponent(escape(atob(s))))}
function hs(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,"0")}
function qend(){sent=($("sq")?$("sq").value:"").trim().slice(0,300);const sc=Q.filter((q,i)=>ok(q,ans[i])).length,st=Math.round(sc/Q.length*5);

function cp(){const t=$("rc");t.select();let ok=0;try{navigator.clipboard.writeText(t.value);ok=1}catch(e){}try{document.execCommand("copy");ok=1}catch(e){}$("cm").textContent=ok?"✅ Code copied!":"Please press and hold the code to copy it."}

const bad=m=>{E.textContent="⚠️ "+m};
